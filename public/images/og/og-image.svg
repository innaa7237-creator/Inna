<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad)"/>

  <!-- Pattern overlay -->
  <rect width="1200" height="630" fill="url(#pattern)" opacity="0.1"/>

  <!-- Content -->
  <text x="600" y="280" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    Inna Andrusenko
  </text>

  <text x="600" y="340" font-family="Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.9)" text-anchor="middle">
    Professional Violinist
  </text>

  <!-- Decorative line -->
  <line x1="400" y1="380" x2="800" y2="380" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>

  <!-- Music note icon -->
  <circle cx="600" cy="480" r="60" fill="rgba(255,255,255,0.2)"/>
  <text x="600" y="510" font-size="60" fill="white" text-anchor="middle">🎻</text>
</svg>
